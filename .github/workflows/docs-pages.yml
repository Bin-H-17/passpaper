name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp -r docs _site/docs
          cp LICENSE _site/LICENSE
          python -m pip install --quiet markdown
          python - <<'EOF'
          import markdown, pathlib, re
          # Convert README.md to HTML with simple template
          readme = pathlib.Path('_site/index.md').read_text(encoding='utf-8')
          body = markdown.markdown(readme, extensions=['tables', 'fenced_code'])
          html = f'''<!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>递纸 PassPaper</title>
          <style>
          body {{ max-width: 860px; margin: 0 auto; padding: 24px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.7; color: #1a1a2e; }}
          code {{ background: #f0f0f5; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }}
          pre {{ background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }}
          pre code {{ background: none; }}
          table {{ border-collapse: collapse; width: 100%; }}
          th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }}
          img {{ max-width: 100%; }}
          a {{ color: #2563eb; }}
          </style>
          </head>
          <body>
          {body}
          </body>
          </html>'''
          pathlib.Path('_site/index.html').write_text(html, encoding='utf-8')
          # Convert docs too
          for md in pathlib.Path('_site/docs').glob('*.md'):
              b = markdown.markdown(md.read_text(encoding='utf-8'), extensions=['tables', 'fenced_code'])
              out = f'<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{md.stem}</title><style>body {{ max-width: 860px; margin: 0 auto; padding: 24px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.7; }} code {{ background: #f0f0f5; padding: 2px 6px; border-radius: 4px; }} pre {{ background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }} table {{ border-collapse: collapse; width: 100%; }} th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }} a {{ color: #2563eb; }}</style></head><body>{b}</body></html>'
              md.with_suffix('.html').write_text(out, encoding='utf-8')
              md.unlink()
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
